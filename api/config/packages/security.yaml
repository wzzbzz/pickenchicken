security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\SessionAuthenticator
            entry_point: App\Security\SessionAuthenticator

    # No path-based access_control here on purpose — every route's access
    # requirement is declared on the controller action itself via the
    # #[RequiresPermission] attribute and enforced uniformly by
    # App\EventListener\PermissionCheckListener, which also writes an
    # ActionLog row for every request. Keeping path-regex rules here too
    # would let some routes get denied upstream of that listener (skipping
    # both the log and the single source of truth for what a route needs).

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
