security:
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\SessionAuthenticator
            entry_point: App\Security\SessionAuthenticator

    access_control:
        - { path: ^/api/auth/request-login,   roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-token,    roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login,           roles: PUBLIC_ACCESS }
        - { path: ^/api/location/current,    roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout,          roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/me,              roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/update-username, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/admin,                roles: ROLE_ADMIN }
        - { path: ^/api/dev/clock,            roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
